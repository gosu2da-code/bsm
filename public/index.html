<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>섹터 트리</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>섹터 트리</h1>
    <span class="conn" id="conn"><i class="dot" id="conn-dot"></i><span id="conn-text">연결 중</span></span>
    <span class="divider" aria-hidden="true"></span>
    <div class="mode-seg" id="mode-seg" role="group" aria-label="보기 방식">
      <button data-mode="live" aria-pressed="true">live</button>
      <button data-mode="each" aria-pressed="false">each</button>
    </div>
    <div class="strip" id="strip" aria-label="마켓"></div>
    <select id="each-date" aria-label="날짜" hidden></select>
    <span class="spacer"></span>
    <span class="chip" id="chip-count">0 / 100</span>
    <span class="chip muted" id="chip-time">–</span>
    <button id="sort-toggle" class="btn small">정렬: 등락률순</button>
    <button id="edit-toggle" class="btn small">편집</button>
  </header>

  <div id="banners"></div>

  <main id="board" class="board"></main>

  <script src="app.js"></script>
</body>
</html>
