<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>섹터 트리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>섹터 트리</h1>
    <div class="chips">
      <span class="chip" id="chip-kr">국내 –</span>
      <span class="chip" id="chip-us">미국 –</span>
      <span class="chip" id="chip-conn"><i class="dot"></i><span>연결 중</span></span>
      <span class="chip" id="chip-count">0 / 100</span>
      <span class="chip muted" id="chip-time">–</span>
    </div>
    <button id="edit-toggle" class="btn">편집</button>
    <div class="modebar">
      <div class="mode-seg" id="mode-seg" role="group" aria-label="보기 방식">
        <button data-mode="live" aria-pressed="true">live</button>
        <button data-mode="each" aria-pressed="false">each</button>
      </div>
      <div class="strip" id="strip" aria-label="마켓"></div>
      <select id="each-date" aria-label="날짜" hidden></select>
      <span class="each-hint" id="each-hint" hidden>보고 싶은 마켓을 고르세요</span>
      <button id="sort-toggle" class="btn small sort-toggle">정렬: 등락률순</button>
    </div>
  </header>

  <div id="banners"></div>

  <main id="board" class="board"></main>

  <script src="app.js"></script>
</body>
</html>
